name: Build for PR and pushes

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '.gitignore'
      - '**.md'
      - 'metadata.json'
      - 'LICENSE'
      - 'pack/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '.gitignore'
      - '**.md'
      - 'metadata.json'
      - 'LICENSE'
      - 'pack/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build_windows:
    name: Build for Windows (x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.10"
          architecture: x86
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      - name: Verify 32-bit Python
        run: python -c "import struct; assert struct.calcsize('P') == 4"
      - name: Build binary (PyInstaller)
        run: |
          python -m PyInstaller --onefile --windowed --noconfirm --clean --name main --icon pack/icon.ico --hidden-import vdf main.py
      - name: Verify x86 executable
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes("dist/main.exe")
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $machine = [BitConverter]::ToUInt16($binary, $peOffset + 4)
          if ($machine -ne 0x014c) {
            throw "Expected an x86 PE executable, got machine type 0x$($machine.ToString('x4'))"
          }
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows-x86
          path: ./dist/main.exe

  build_windows_uninstaller:
    name: Build uninstaller for Windows (x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.10"
          architecture: x86
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      - name: Verify 32-bit Python
        run: python -c "import struct; assert struct.calcsize('P') == 4"
      - name: Build uninstaller (PyInstaller one-file)
        run: |
          python -m PyInstaller --onefile --windowed --uac-admin --noconfirm --clean --name uninstall-windows-x86 --icon pack/icon.ico uninstaller.py
      - name: Verify x86 executable
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes("dist/uninstall-windows-x86.exe")
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $machine = [BitConverter]::ToUInt16($binary, $peOffset + 4)
          if ($machine -ne 0x014c) {
            throw "Expected an x86 PE executable, got machine type 0x$($machine.ToString('x4'))"
          }
      - name: Upload uninstaller
        uses: actions/upload-artifact@v7
        with:
          name: uninstaller-windows-x86
          path: ./dist/uninstall-windows-x86.exe

  build_linux:
    name: Build for Linux (i686 binary and AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Restore i686 compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache-linux-x86
          key: ccache-linux-i686-installer-${{ hashFiles('scripts/build_linux_x86.sh', 'requirements-linux-x86.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-i686-installer-${{ hashFiles('scripts/build_linux_x86.sh', 'requirements-linux-x86.txt') }}-
            ccache-linux-i686-installer-
      - name: Build true 32-bit Linux artifacts
        run: |
          mkdir -p .ccache-linux-x86
          docker run --rm --platform linux/386 \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=1G \
            -v "$PWD:/work" -v "$PWD/.ccache-linux-x86:/ccache" \
            -w /work i386/debian:bullseye \
            bash scripts/build_linux_x86.sh installer
      - name: Upload 32-bit binary
        uses: actions/upload-artifact@v7
        with:
          name: installer-linux-x86-binary
          path: ./main.bin
      - name: Upload 32-bit AppImage
        uses: actions/upload-artifact@v7
        with:
          name: installer-linux-x86-AppImage
          path: ./main.AppImage

  build_linux_uninstaller:
    name: Build uninstaller for Linux (i686)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Restore i686 compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache-linux-x86
          key: ccache-linux-i686-uninstaller-${{ hashFiles('scripts/build_linux_x86.sh', 'requirements-linux-x86.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-i686-uninstaller-${{ hashFiles('scripts/build_linux_x86.sh', 'requirements-linux-x86.txt') }}-
            ccache-linux-i686-uninstaller-
      - name: Build true 32-bit Linux uninstaller artifacts
        run: |
          mkdir -p .ccache-linux-x86
          docker run --rm --platform linux/386 \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=1G \
            -v "$PWD:/work" -v "$PWD/.ccache-linux-x86:/ccache" \
            -w /work i386/debian:bullseye \
            bash scripts/build_linux_x86.sh uninstaller
      - name: Upload 32-bit uninstaller binary
        uses: actions/upload-artifact@v7
        with:
          name: uninstaller-linux-x86-binary
          path: ./uninstall-linux-x86.bin
      - name: Upload 32-bit uninstaller AppImage
        uses: actions/upload-artifact@v7
        with:
          name: uninstaller-linux-x86-AppImage
          path: ./uninstall-linux-x86.AppImage

  build_macos:
    name: Build for macOS (x86_64 - runs on both Intel & Apple Silicon)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.18"
          architecture: x64
      
      - name: Install dependencies (x86_64)
        run: |
          python -m pip install -r requirements.txt pillow==10.4.0
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      
      - name: Convert icon to .icns
        run: |
          python -c "
          from PIL import Image
          import os
          
          icon_path = 'pack/icon.ico'
          if not os.path.exists(icon_path):
              print(f'Warning: {icon_path} not found')
              exit(0)
          
          img = Image.open(icon_path)
          if hasattr(img, 'n_frames') and img.n_frames > 1:
              img.seek(0)
          img = img.convert('RGBA')
          img = img.resize((256, 256), Image.Resampling.LANCZOS)
          img.save('pack/icon.icns', format='ICNS')
          print('✅ icon.icns created successfully')
          "
      
      - name: Build .app bundle (x86_64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m nuitka \
            --macos-create-app-bundle \
            --standalone \
            --macos-target-arch=x86_64 \
            --macos-app-icon=pack/icon.icns \
            --include-module=vdf \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            main.py
      
      - name: Verify architecture (should be x86_64)
        run: |
          echo "=== Binary Architecture ==="
          file main.app/Contents/MacOS/main
          lipo -info main.app/Contents/MacOS/main
          
          # 验证是否为 x86_64
          if lipo -info main.app/Contents/MacOS/main | grep -q "x86_64"; then
            echo "✅ Built for Intel x86_64"
            echo "✅ Will run natively on Intel Mac"
            echo "✅ Will run via Rosetta 2 on Apple Silicon Mac"
          else
            echo "❌ Not built for x86_64"
            exit 1
          fi
      
      - name: Codesign (ad-hoc)
        run: |
          # 签名整个应用
          codesign --force --deep --sign - main.app
          
          # 验证签名
          codesign --verify --deep --strict main.app || echo "⚠️  Ad-hoc signing warning (expected)"
      
      - name: Create zip
        run: |
          ditto -c -k --keepParent main.app macos.zip
      
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: installer-macos-universal-compatible
          path: ./macos.zip

  build_macos_uninstaller:
    name: Build uninstaller for macOS (x86_64)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.18"
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pillow==10.4.0
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      - name: Convert icon to .icns
        run: |
          python -c "from PIL import Image; image = Image.open('pack/icon.ico').convert('RGBA').resize((256, 256), Image.Resampling.LANCZOS); image.save('pack/uninstaller.icns', format='ICNS')"
      - name: Build uninstaller app (x86_64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m nuitka \
            --macos-create-app-bundle \
            --standalone \
            --macos-target-arch=x86_64 \
            --macos-app-icon=pack/uninstaller.icns \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            uninstaller.py
          mv uninstaller.app uninstall-macos.app
      - name: Verify, sign and package
        run: |
          file uninstall-macos.app/Contents/MacOS/uninstaller
          lipo -info uninstall-macos.app/Contents/MacOS/uninstaller | grep -q "x86_64"
          codesign --force --deep --sign - uninstall-macos.app
          codesign --verify --deep --strict uninstall-macos.app
          ditto -c -k --keepParent uninstall-macos.app uninstall-macos.zip
      - name: Upload uninstaller
        uses: actions/upload-artifact@v7
        with:
          name: uninstaller-macos-x86_64
          path: ./uninstall-macos.zip
