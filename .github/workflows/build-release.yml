name: Build for release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build and update
        required: true
        type: string

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}

jobs:
  build_windows:
    name: Build for Windows (x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.10"
          architecture: x86
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      - name: Verify 32-bit Python
        run: python -c "import struct; assert struct.calcsize('P') == 4"
      - name: Build binary (PyInstaller)
        run: |
          python -m PyInstaller --onefile --windowed --noconfirm --clean --name main-windows-x86 --icon pack/icon.ico --hidden-import vdf main.py
      - name: Verify x86 executable
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes("dist/main-windows-x86.exe")
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $machine = [BitConverter]::ToUInt16($binary, $peOffset + 4)
          if ($machine -ne 0x014c) {
            throw "Expected an x86 PE executable, got machine type 0x$($machine.ToString('x4'))"
          }
      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./dist/main-windows-x86.exe

  build_windows_uninstaller:
    name: Build uninstaller for Windows (x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.10"
          architecture: x86
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      - name: Verify 32-bit Python
        run: python -c "import struct; assert struct.calcsize('P') == 4"
      - name: Build uninstaller (PyInstaller one-file)
        run: |
          python -m PyInstaller --onefile --windowed --uac-admin --noconfirm --clean --name uninstall-windows-x86 --icon pack/icon.ico uninstaller.py
      - name: Verify x86 executable
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes("dist/uninstall-windows-x86.exe")
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $machine = [BitConverter]::ToUInt16($binary, $peOffset + 4)
          if ($machine -ne 0x014c) {
            throw "Expected an x86 PE executable, got machine type 0x$($machine.ToString('x4'))"
          }
      - name: Upload uninstaller to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./dist/uninstall-windows-x86.exe

  build_linux:
    name: Build for Linux (binary and AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.18"
          architecture: x64
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 \
            libdbus-1-3 libfuse2 patchelf \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 \
            file
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pillow==10.4.0
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      - name: Build downloadable binary with Nuitka (onefile)
        run: |
          python -m nuitka \
            --onefile \
            --include-module=vdf \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            --deployment \
            --output-filename=main.bin \
            main.py
          chmod +x main.bin
          
          # 验证二进制格式；不启动 GUI，避免无显示环境时等待。
          file main.bin
      - name: Upload binary to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./main.bin
      - name: Build AppImage payload with Nuitka (standalone directory)
        run: |
          python -m nuitka \
            --standalone \
            --include-module=vdf \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            --deployment \
            --output-dir=appimage-main-build \
            --output-filename=main \
            main.py
          test -x appimage-main-build/main.dist/main
          file appimage-main-build/main.dist/main
      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib

          # Package the independently built standalone directory. Do not embed
          # the downloadable onefile binary in the AppImage.
          cp -a appimage-main-build/main.dist/. AppDir/usr/bin/
          chmod +x AppDir/usr/bin/main
          
          # 复制必要的系统库（仍然需要，因为 Qt 需要）
          LIBRARIES=(
            "libxkbcommon.so.0" "libdbus-1.so.3" "libEGL.so.1"
            "libGL.so.1" "libOpenGL.so.0" "libGLX.so.0"
            "libGLdispatch.so.0" "libxcb-xinerama.so.0" "libxcb-icccm.so.4"
            "libxcb-image.so.0" "libxcb-keysyms.so.1" "libxcb-randr.so.0"
            "libxcb-render-util.so.0" "libxcb-shape.so.0" "libxcb-xfixes.so.0"
            "libxcb-xkb.so.1" "libxcb.so.1" "libX11.so.6"
            "libXext.so.6" "libXi.so.6" "libXrender.so.1"
            "libXcursor.so.1" "libXfixes.so.3" "libXrandr.so.2"
            "libXdamage.so.1" "libXcomposite.so.1" "libdrm.so.2"
            "libgbm.so.1" "libxkbcommon-x11.so.0"
          )
          
          for lib in "${LIBRARIES[@]}"; do
            find /usr/lib -name "$lib" 2>/dev/null | head -1 | xargs -r cp -t AppDir/usr/lib/ || true
          done
          
          # 创建 AppRun
          cat > AppDir/AppRun << 'APPRUNEOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          
          # 设置库路径（给 Qt 等系统库）
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          # Qt environment variables
          export QT_AUTO_SCREEN_SCALE_FACTOR=0
          export QT_SCALE_FACTOR=1
          
          # 执行主程序
          exec "$HERE/usr/bin/main" "$@"
          APPRUNEOF
          chmod +x AppDir/AppRun
          
          # 创建图标
          python3 -c "
          from PIL import Image
          img = Image.open('pack/icon.ico')
          if hasattr(img, 'n_frames') and img.n_frames > 1:
              img.seek(0)
          img = img.convert('RGBA')
          img = img.resize((256, 256), Image.Resampling.LANCZOS)
          img.save('AppDir/icon.png')
          "
          
          # .desktop 文件
          cat > AppDir/main.desktop << 'DESKTOPEOF'
          [Desktop Entry]
          Name=ChinesePack
          Exec=main
          Icon=icon
          Type=Application
          Categories=Utility;
          DESKTOPEOF
      - name: Build AppImage
        run: |
          wget -nv "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage -v AppDir main.AppImage
      - name: Upload AppImage to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./main.AppImage

  build_linux_uninstaller:
    name: Build uninstaller for Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.18"
          architecture: x64
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 \
            libdbus-1-3 libfuse2 patchelf \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 \
            file
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pillow==10.4.0
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      - name: Build uninstaller with Nuitka (onefile)
        run: |
          python -m nuitka \
            --onefile \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            --deployment \
            --output-filename=uninstall-linux-x64.bin \
            uninstaller.py
          chmod +x uninstall-linux-x64.bin
          file uninstall-linux-x64.bin
      - name: Upload uninstaller to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./uninstall-linux-x64.bin
      - name: Build uninstaller AppImage payload with Nuitka (standalone directory)
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            --deployment \
            --output-dir=appimage-uninstaller-build \
            --output-filename=uninstaller \
            uninstaller.py
          test -x appimage-uninstaller-build/uninstaller.dist/uninstaller
          file appimage-uninstaller-build/uninstaller.dist/uninstaller
      - name: Prepare uninstaller AppDir
        run: |
          mkdir -p UninstallerAppDir/usr/bin UninstallerAppDir/usr/lib
          cp -a appimage-uninstaller-build/uninstaller.dist/. UninstallerAppDir/usr/bin/
          chmod +x UninstallerAppDir/usr/bin/uninstaller

          LIBRARIES=(
            "libxkbcommon.so.0" "libdbus-1.so.3" "libEGL.so.1"
            "libGL.so.1" "libOpenGL.so.0" "libGLX.so.0"
            "libGLdispatch.so.0" "libxcb-xinerama.so.0" "libxcb-icccm.so.4"
            "libxcb-image.so.0" "libxcb-keysyms.so.1" "libxcb-randr.so.0"
            "libxcb-render-util.so.0" "libxcb-shape.so.0" "libxcb-xfixes.so.0"
            "libxcb-xkb.so.1" "libxcb.so.1" "libX11.so.6"
            "libXext.so.6" "libXi.so.6" "libXrender.so.1"
            "libXcursor.so.1" "libXfixes.so.3" "libXrandr.so.2"
            "libXdamage.so.1" "libXcomposite.so.1" "libdrm.so.2"
            "libgbm.so.1" "libxkbcommon-x11.so.0"
          )
          for lib in "${LIBRARIES[@]}"; do
            find /usr/lib -name "$lib" 2>/dev/null | head -1 | xargs -r cp -t UninstallerAppDir/usr/lib/ || true
          done

          cat > UninstallerAppDir/AppRun << 'APPRUNEOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          # Match the installer's Qt scaling behavior inside AppImage.
          export QT_AUTO_SCREEN_SCALE_FACTOR=0
          export QT_SCALE_FACTOR=1

          exec "$HERE/usr/bin/uninstaller" "$@"
          APPRUNEOF
          chmod +x UninstallerAppDir/AppRun

          python3 -c "
          from PIL import Image
          image = Image.open('pack/icon.ico')
          if hasattr(image, 'n_frames') and image.n_frames > 1:
              image.seek(0)
          image = image.convert('RGBA')
          image = image.resize((256, 256), Image.Resampling.LANCZOS)
          image.save('UninstallerAppDir/icon.png')
          "
          cat > UninstallerAppDir/uninstaller.desktop << 'DESKTOPEOF'
          [Desktop Entry]
          Name=Universal Installer Uninstaller
          Exec=uninstaller
          Icon=icon
          Type=Application
          Categories=Utility;
          DESKTOPEOF
      - name: Build uninstaller AppImage
        run: |
          wget -nv "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage -v UninstallerAppDir uninstall-linux-x64.AppImage
          chmod +x uninstall-linux-x64.AppImage
      - name: Upload uninstaller AppImage to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./uninstall-linux-x64.AppImage

  build_macos:
    name: Build for macOS (x86_64 - runs on both Intel & Apple Silicon)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.18"
          architecture: x64

      - name: Install dependencies (x86_64)
        run: |
          python -m pip install -r requirements.txt pillow==10.4.0
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      
      - name: Convert icon to .icns
        run: |
          python -c "
          from PIL import Image
          import os
          
          icon_path = 'pack/icon.ico'
          if not os.path.exists(icon_path):
              print(f'Warning: {icon_path} not found')
              exit(0)
          
          img = Image.open(icon_path)
          if hasattr(img, 'n_frames') and img.n_frames > 1:
              img.seek(0)
          img = img.convert('RGBA')
          img = img.resize((256, 256), Image.Resampling.LANCZOS)
          img.save('pack/icon.icns', format='ICNS')
          print('✅ icon.icns created successfully')
          "
      
      - name: Build .app bundle (x86_64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m nuitka \
            --macos-create-app-bundle \
            --standalone \
            --macos-target-arch=x86_64 \
            --macos-app-icon=pack/icon.icns \
            --include-module=vdf \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            main.py
      
      - name: Verify architecture (should be x86_64)
        run: |
          echo "=== Binary Architecture ==="
          file main.app/Contents/MacOS/main
          lipo -info main.app/Contents/MacOS/main
          
          # 验证是否为 x86_64
          if lipo -info main.app/Contents/MacOS/main | grep -q "x86_64"; then
            echo "✅ Built for Intel x86_64"
            echo "✅ Will run natively on Intel Mac"
            echo "✅ Will run via Rosetta 2 on Apple Silicon Mac"
          else
            echo "❌ Not built for x86_64"
            exit 1
          fi
      
      - name: Codesign (ad-hoc)
        run: |
          # 签名整个应用
          codesign --force --deep --sign - main.app
          
          # 验证签名
          codesign --verify --deep --strict main.app || echo "⚠️  Ad-hoc signing warning (expected)"
      
      - name: Create zip
        run: |
          ditto -c -k --keepParent main.app macos.zip
      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./macos.zip

  build_macos_uninstaller:
    name: Build uninstaller for macOS (x86_64)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.18"
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pillow==10.4.0
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      - name: Convert icon to .icns
        run: |
          python -c "from PIL import Image; image = Image.open('pack/icon.ico').convert('RGBA').resize((256, 256), Image.Resampling.LANCZOS); image.save('pack/uninstaller.icns', format='ICNS')"
      - name: Build uninstaller app (x86_64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m nuitka \
            --macos-create-app-bundle \
            --standalone \
            --macos-target-arch=x86_64 \
            --macos-app-icon=pack/uninstaller.icns \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            uninstaller.py
          mv uninstaller.app uninstall-macos.app
      - name: Verify, sign and package
        run: |
          file uninstall-macos.app/Contents/MacOS/uninstaller
          lipo -info uninstall-macos.app/Contents/MacOS/uninstaller | grep -q "x86_64"
          codesign --force --deep --sign - uninstall-macos.app
          codesign --verify --deep --strict uninstall-macos.app
          ditto -c -k --keepParent uninstall-macos.app uninstall-macos.zip
      - name: Upload uninstaller to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./uninstall-macos.zip
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.0

      - name: Generate release notes for current tag
        run: git cliff --current --output RELEASE_NOTES.md

      - name: Add changelog to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
