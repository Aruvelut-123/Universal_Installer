name: Build for release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build and update
        required: true
        type: string

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}

jobs:
  build_windows:
    name: Build for Windows (x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.10"
          architecture: x86
      - uses: ./.github/actions/setup-windows-pyinstaller-cache
        with:
          scope: installer
          dependency-hash: ${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      - name: Verify 32-bit Python
        run: python -c "import struct; assert struct.calcsize('P') == 4"
      - name: Build binary (PyInstaller)
        run: |
          python -m PyInstaller --onefile --windowed --noconfirm --workpath "$env:PYINSTALLER_WORKPATH" --name main --icon pack/icon.ico --hidden-import vdf main.py
      - name: Verify x86 executable
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes("dist/main.exe")
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $machine = [BitConverter]::ToUInt16($binary, $peOffset + 4)
          if ($machine -ne 0x014c) {
            throw "Expected an x86 PE executable, got machine type 0x$($machine.ToString('x4'))"
          }
      - name: Smoke test packaged installer
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:UNIVERSAL_INSTALLER_SMOKE_TEST = "1"
          $env:UNIVERSAL_INSTALLER_SMOKE_REPORT = "$env:GITHUB_WORKSPACE\smoke-report-windows-installer.json"
          $process = Start-Process -FilePath ".\dist\main.exe" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            exit $process.ExitCode
          }
      - name: Upload installer smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-windows-installer
          path: ./smoke-report-windows-installer.json
          if-no-files-found: ignore
      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./dist/main.exe

  build_windows_uninstaller:
    name: Build uninstaller for Windows (x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.10"
          architecture: x86
      - uses: ./.github/actions/setup-windows-pyinstaller-cache
        with:
          scope: uninstaller
          dependency-hash: ${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      - name: Verify 32-bit Python
        run: python -c "import struct; assert struct.calcsize('P') == 4"
      - name: Build uninstaller (PyInstaller one-file)
        run: |
          python -m PyInstaller --onefile --windowed --uac-admin --noconfirm --workpath "$env:PYINSTALLER_WORKPATH" --name uninstall-windows-x86 --icon pack/icon.ico uninstaller.py
      - name: Verify x86 executable
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes("dist/uninstall-windows-x86.exe")
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $machine = [BitConverter]::ToUInt16($binary, $peOffset + 4)
          if ($machine -ne 0x014c) {
            throw "Expected an x86 PE executable, got machine type 0x$($machine.ToString('x4'))"
          }
      - name: Smoke test packaged uninstaller
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:UNIVERSAL_INSTALLER_SMOKE_TEST = "1"
          $env:UNIVERSAL_INSTALLER_SMOKE_REPORT = "$env:GITHUB_WORKSPACE\smoke-report-windows-uninstaller.json"
          $process = Start-Process -FilePath ".\dist\uninstall-windows-x86.exe" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            exit $process.ExitCode
          }
      - name: Upload uninstaller smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-windows-uninstaller
          path: ./smoke-report-windows-uninstaller.json
          if-no-files-found: ignore
      - name: Upload uninstaller to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./dist/uninstall-windows-x86.exe

  build_linux:
    name: Build for Linux (i686 binary)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Restore i686 PyInstaller cache
        uses: actions/cache@v6
        with:
          path: .pyinstaller-work-linux-x86
          key: pyinstaller-linux-i686-installer-${{ hashFiles('scripts/build_linux_x86.sh', 'requirements-linux-x86.txt') }}-${{ github.sha }}
          restore-keys: |
            pyinstaller-linux-i686-installer-${{ hashFiles('scripts/build_linux_x86.sh', 'requirements-linux-x86.txt') }}-
            pyinstaller-linux-i686-installer-
      - name: Restore i686 pip cache
        uses: actions/cache@v6
        with:
          path: .pip-cache-linux-x86
          key: pip-linux-i686-${{ hashFiles('requirements-linux-x86.txt') }}-${{ github.sha }}
          restore-keys: |
            pip-linux-i686-${{ hashFiles('requirements-linux-x86.txt') }}-
            pip-linux-i686-
      - name: Build true 32-bit Linux binary
        run: |
          mkdir -p .pyinstaller-work-linux-x86 .pip-cache-linux-x86
          docker run --rm --platform linux/386 \
            -e PIP_CACHE_DIR=/pip-cache -e PYINSTALLER_WORKPATH=/pyinstaller-work/installer -e SMOKE_REPORT_PATH=smoke-report-linux-installer.json \
            -v "$PWD:/work" -v "$PWD/.pyinstaller-work-linux-x86:/pyinstaller-work" -v "$PWD/.pip-cache-linux-x86:/pip-cache" \
            -w /work i386/debian:bullseye \
            bash scripts/build_linux_x86.sh installer
      - name: Upload installer smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-linux-installer
          path: ./smoke-report-linux-installer.json
          if-no-files-found: ignore
      - name: Upload installer artifacts to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./main.bin

  build_linux_uninstaller:
    name: Build uninstaller for Linux (i686)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Restore i686 PyInstaller cache
        uses: actions/cache@v6
        with:
          path: .pyinstaller-work-linux-x86
          key: pyinstaller-linux-i686-uninstaller-${{ hashFiles('scripts/build_linux_x86.sh', 'requirements-linux-x86.txt') }}-${{ github.sha }}
          restore-keys: |
            pyinstaller-linux-i686-uninstaller-${{ hashFiles('scripts/build_linux_x86.sh', 'requirements-linux-x86.txt') }}-
            pyinstaller-linux-i686-uninstaller-
      - name: Restore i686 pip cache
        uses: actions/cache@v6
        with:
          path: .pip-cache-linux-x86
          key: pip-linux-i686-${{ hashFiles('requirements-linux-x86.txt') }}-${{ github.sha }}
          restore-keys: |
            pip-linux-i686-${{ hashFiles('requirements-linux-x86.txt') }}-
            pip-linux-i686-
      - name: Build true 32-bit Linux uninstaller
        run: |
          mkdir -p .pyinstaller-work-linux-x86 .pip-cache-linux-x86
          docker run --rm --platform linux/386 \
            -e PIP_CACHE_DIR=/pip-cache -e PYINSTALLER_WORKPATH=/pyinstaller-work/uninstaller -e SMOKE_REPORT_PATH=smoke-report-linux-uninstaller.json \
            -v "$PWD:/work" -v "$PWD/.pyinstaller-work-linux-x86:/pyinstaller-work" -v "$PWD/.pip-cache-linux-x86:/pip-cache" \
            -w /work i386/debian:bullseye \
            bash scripts/build_linux_x86.sh uninstaller
      - name: Upload uninstaller smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-linux-uninstaller
          path: ./smoke-report-linux-uninstaller.json
          if-no-files-found: ignore
      - name: Upload uninstaller artifacts to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./uninstall-linux-x86.bin

  build_macos:
    name: Build for macOS (x86_64 - runs on both Intel & Apple Silicon)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.18"
          architecture: x64
      - name: Restore macOS PyInstaller cache
        uses: actions/cache@v6
        with:
          path: .pyinstaller-work-macos-x64
          key: pyinstaller-macos-x64-installer-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            pyinstaller-macos-x64-installer-${{ hashFiles('requirements.txt') }}-
            pyinstaller-macos-x64-installer-

      - name: Install dependencies (x86_64)
        run: |
          python -m pip install -r requirements.txt pillow==10.4.0
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      
      - name: Convert icon to .icns
        run: |
          python -c "
          from PIL import Image
          import os
          
          icon_path = 'pack/icon.ico'
          if not os.path.exists(icon_path):
              print(f'Warning: {icon_path} not found')
              exit(0)
          
          img = Image.open(icon_path)
          if hasattr(img, 'n_frames') and img.n_frames > 1:
              img.seek(0)
          img = img.convert('RGBA')
          img = img.resize((256, 256), Image.Resampling.LANCZOS)
          img.save('pack/icon.icns', format='ICNS')
          print('✅ icon.icns created successfully')
          "
      
      - name: Build .app bundle with PyInstaller (x86_64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m PyInstaller \
            --windowed \
            --noconfirm \
            --target-architecture x86_64 \
            --workpath .pyinstaller-work-macos-x64/installer \
            --name main \
            --icon pack/icon.icns \
            --hidden-import vdf \
            main.py
      
      - name: Verify architecture (should be x86_64)
        run: |
          echo "=== Binary Architecture ==="
          file dist/main.app/Contents/MacOS/main
          lipo -info dist/main.app/Contents/MacOS/main
          
          # 验证是否为 x86_64
          if lipo -info dist/main.app/Contents/MacOS/main | grep -q "x86_64"; then
            echo "✅ Built for Intel x86_64"
            echo "✅ Will run natively on Intel Mac"
            echo "✅ Will run via Rosetta 2 on Apple Silicon Mac"
          else
            echo "❌ Not built for x86_64"
            exit 1
          fi
      
      - name: Codesign (ad-hoc)
        run: |
          # 签名整个应用
          codesign --force --deep --sign - dist/main.app
          
          # 验证签名
          codesign --verify --deep --strict dist/main.app || echo "⚠️  Ad-hoc signing warning (expected)"
      - name: Smoke test packaged installer
        env:
          QT_QPA_PLATFORM: offscreen
          UNIVERSAL_INSTALLER_SMOKE_TEST: "1"
          UNIVERSAL_INSTALLER_SMOKE_REPORT: ${{ github.workspace }}/smoke-report-macos-installer.json
        run: |
          dist/main.app/Contents/MacOS/main
      - name: Upload installer smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-macos-installer
          path: ./smoke-report-macos-installer.json
          if-no-files-found: ignore
      
      - name: Create zip
        run: |
          ditto -c -k --keepParent dist/main.app macos.zip
      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./macos.zip

  build_macos_uninstaller:
    name: Build uninstaller for macOS (x86_64)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-python-cache
        id: python-cache
        with:
          python-version: "3.8.18"
          architecture: x64
      - name: Restore macOS PyInstaller cache
        uses: actions/cache@v6
        with:
          path: .pyinstaller-work-macos-x64
          key: pyinstaller-macos-x64-uninstaller-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            pyinstaller-macos-x64-uninstaller-${{ hashFiles('requirements.txt') }}-
            pyinstaller-macos-x64-uninstaller-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pillow==10.4.0
      - name: Save pip cache before build
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.python-cache.outputs.cache-dir }}
          key: ${{ steps.python-cache.outputs.cache-key }}
      - name: Convert icon to .icns
        run: |
          python -c "from PIL import Image; image = Image.open('pack/icon.ico').convert('RGBA').resize((256, 256), Image.Resampling.LANCZOS); image.save('pack/uninstaller.icns', format='ICNS')"
      - name: Build uninstaller app with PyInstaller (x86_64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m PyInstaller \
            --windowed \
            --noconfirm \
            --target-architecture x86_64 \
            --workpath .pyinstaller-work-macos-x64/uninstaller \
            --name uninstall-macos \
            --icon pack/uninstaller.icns \
            uninstaller.py
      - name: Verify, sign and package
        run: |
          file dist/uninstall-macos.app/Contents/MacOS/uninstall-macos
          lipo -info dist/uninstall-macos.app/Contents/MacOS/uninstall-macos | grep -q "x86_64"
          codesign --force --deep --sign - dist/uninstall-macos.app
          codesign --verify --deep --strict dist/uninstall-macos.app
          ditto -c -k --keepParent dist/uninstall-macos.app uninstall-macos.zip
      - name: Smoke test packaged uninstaller
        env:
          QT_QPA_PLATFORM: offscreen
          UNIVERSAL_INSTALLER_SMOKE_TEST: "1"
          UNIVERSAL_INSTALLER_SMOKE_REPORT: ${{ github.workspace }}/smoke-report-macos-uninstaller.json
        run: |
          dist/uninstall-macos.app/Contents/MacOS/uninstall-macos
      - name: Upload uninstaller smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-macos-uninstaller
          path: ./smoke-report-macos-uninstaller.json
          if-no-files-found: ignore
      - name: Upload uninstaller to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./uninstall-macos.zip

  smoke_test_summary:
    name: Packaged binary smoke test summary
    if: always()
    needs:
      - build_windows
      - build_windows_uninstaller
      - build_linux
      - build_linux_uninstaller
      - build_macos
      - build_macos_uninstaller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download smoke reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: smoke-report-*
          path: smoke-reports
          merge-multiple: true
      - name: Write detailed smoke test table
        run: python3 scripts/render_smoke_summary.py smoke-reports
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.0

      - name: Generate release notes for current tag
        run: git cliff --current --output RELEASE_NOTES.md

      - name: Add changelog to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
